<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InduSafeLearn - Login & Signup</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>InduSafeLearn</h1>
                <p>Interactive Learning Platform</p>
            </div>

            <!-- Login Form -->
            <div class="form-container" id="loginForm">
                <h2>Login</h2>
                <form onsubmit="handleLogin(event)">
                    <div class="form-group">
                        <label for="loginEmail">Email Address</label>
                        <input type="email" id="loginEmail" name="email" required placeholder="Enter your email">
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">Password</label>
                        <div class="password-input-wrap">
                            <input type="password" id="loginPassword" name="password" required placeholder="Enter your password">
                            <button type="button" class="password-toggle" aria-label="Show password" aria-pressed="false">&#128065;</button>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">Login</button>
                </form>
                <p class="form-switch">Don't have an account? <a href="#" onclick="toggleForms()">Sign Up</a></p>
            </div>

            <!-- Signup Form -->
            <div class="form-container hidden" id="signupForm">
                <h2>Create Account</h2>
                <form onsubmit="handleSignup(event)">
                    <div class="form-group">
                        <label for="signupName">Full Name</label>
                        <input type="text" id="signupName" name="name" required placeholder="Enter your full name">
                    </div>
                    <div class="form-group">
                        <label for="signupEmail">Email Address</label>
                        <input type="email" id="signupEmail" name="email" required placeholder="Enter your email">
                    </div>
                    <div class="form-group">
                        <label for="signupPassword">Password</label>
                        <div class="password-input-wrap">
                            <input type="password" id="signupPassword" name="password" required placeholder="Create a password">
                            <button type="button" class="password-toggle" aria-label="Show password" aria-pressed="false">&#128065;</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="signupConfirm">Confirm Password</label>
                        <div class="password-input-wrap">
                            <input type="password" id="signupConfirm" name="confirm" required placeholder="Confirm your password">
                            <button type="button" class="password-toggle" aria-label="Show password" aria-pressed="false">&#128065;</button>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">Sign Up</button>
                </form>
                <p class="form-switch">Already have an account? <a href="#" onclick="toggleForms()">Login</a></p>
            </div>

        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
